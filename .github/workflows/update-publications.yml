name: Update publications

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday, 06:00 UTC
  workflow_dispatch:       # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Look for new publications
        id: update
        run: python .github/scripts/update_publications.py --summary "$RUNNER_TEMP/summary.md"

      - name: Open or update the pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/new-publications
          delete-branch: true
          add-paths: research.html
          commit-message: Add new publications to research page
          title: New publications for the research page
          body-path: ${{ runner.temp }}/summary.md
          assignees: ceciliapad
